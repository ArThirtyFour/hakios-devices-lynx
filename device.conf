# devices/lynx/device.conf: what this device repository is (docs/porting/repositories.md has every word).

device lynx
	title       Google Pixel 7a
	vendor      Google
	soc         gs201
	defconfig   lynx_defconfig
	maintainer  ArThirtyFour (README.md)
	status      display     works     1080x2400, the bootloader's scanout buffer kept running by lynxld (DECON0); drawn in software
	status      touch       works     Goodix GT9895 on SPI, powered and set up by lynxld (lynx_touch=1)
	status      buttons     works     power and volume down seen working; volume up is in the driver but untested: that button is broken on the test phone (lynx_touch=1)
	status      cpu         partial   7 of 8 cores (2 X1, 2 A78, 3 A55) at fixed middle rates through ACPM DVFS; no thermal control
	status      gpu         missing   no Mali-G710 driver: no Metal, no OpenGL ES
	status      storage     partial   none of the phone's: the system image comes over USB into RAM at every boot (lynxld + tools/lynxrun)
	status      battery     works     MAX77759 fuel gauge and charger read over I2C: charge, voltage, current, charger state (lynx_battery=1)
	status      bluetooth   missing   step one only: lynxld loads the chip's firmware, the kernel scans the air (lynx_bt=1); nothing Darwin can use
	status      wifi        missing   probes only: PCIe link up and the chip seen; its firmware download does not complete
	status      audio       missing   not started
	status      cellular    missing   not started
	status      thermal     missing   not started: the SoC's own hardware trip is the only guard
